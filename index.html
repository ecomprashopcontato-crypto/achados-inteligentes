<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achados Inteligentes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#2563eb;
    color:#fff;
    padding:20px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:1200px;
    margin:auto;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:20px;
}

.btn{
    background:#f97316;
    color:white;
    text-decoration:none;
    padding:15px 25px;
    border-radius:8px;
    display:inline-block;
    margin-top:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:50px 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    text-align:center;
}

.card img{
    width:100%;
    border-radius:10px;
}

.preco{
    color:#16a34a;
    font-size:24px;
    font-weight:bold;
    margin:15px 0;
}

.botao{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:10px 20px;
    border-radius:6px;
    text-decoration:none
